name: pedido_crud
description: "A new Flutter project."
publish_to: 'none'
version: 1.0.1+57

environment:
  sdk: ^3.7.2

dependencies:
  flutter:
    sdk: flutter

  flutter_localizations:
    sdk: flutter

  cupertino_icons: ^1.0.8
  tutorial_coach_mark: ^1.2.11
  shared_preferences: ^2.2.3
  share_plus: ^11.1.0  
  in_app_review: ^2.0.8
  in_app_purchase: ^3.3.0
  

  youtube_player_flutter: ^9.1.3
  url_launcher: ^6.3.2
  # Firebase (APENAS aqui em dependencies)
  webview_flutter: ^4.8.0
  firebase_core: ^3.5.0
  firebase_analytics: ^11.0.0
  firebase_auth: ^5.3.0
  cloud_firestore: ^5.4.4
  firebase_storage: ^12.3.2
  cloud_functions: ^5.1.4   # ⬅️ ADICIONE ISTO
  facebook_app_events: ^0.30.5
  font_awesome_flutter: ^10.7.0   # ou versão mais recente
  image_picker: ^1.1.2
  image_picker_for_web: ^3.0.4
  dotted_border: ^2.1.0
  file_picker: ^8.0.0
  mime: ^1.0.0
  fl_chart: ^0.66.0
  intl: ^0.20.0
  pdf: ^3.10.7
  printing: ^5.12.0
  google_sign_in: ^6.1.0
  firebase_app_check: ^0.3.2+10
  table_calendar: ^3.0.9
  package_info_plus: ^8.0.0
  qr_flutter: ^4.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.1  # ou versão mais recente

flutter:
  uses-material-design: true

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "imagens/checklist.png"   # ícone principal 1024×1024
  min_sdk_android: 21

  # Android 8+ (Adaptive icons)
  adaptive_icon_background: "#FFFFFF"      # cor de fundo ou imagem
  adaptive_icon_foreground: "imagens/checklist.png"
  # Android 13+ (Themed icons — monocromático)
  adaptive_icon_monochrome: "imagens/checklist.png"  
